name: Build and test Skeleton Graveyard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only superseded PR runs are cancelled. Manual and protected-branch builds stay intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline DSP and UI API checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin compatibility contract
        run: python3 tests/check_compatibility.py
      - name: Test actual processor with JUCE stand-in
        run: bash tests/run.sh
      - name: Type-check editor with JUCE stand-in
        run: bash tests/ui_check.sh

  windows-vst3:
    name: Windows x64 VST3 real JUCE build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE build
        run: cmake -S . -B build -A x64
      - name: Compile VST3
        run: cmake --build build --config Release --target EndlessSmileInspired_VST3 --parallel
      - name: Package actual VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = "build\EndlessSmileInspired_artefacts\Release\VST3\EndlessSmileInspired.vst3"
          $binary = Join-Path $vst3 "Contents\x86_64-win\EndlessSmileInspired.vst3"
          if (!(Test-Path $binary -PathType Leaf)) { throw "Missing VST3 binary: $binary" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path $vst3 -DestinationPath artifacts\EndlessSmileInspired-Windows-x64-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SkeletonGraveyard-v1.2.0-Windows-x64-VST3
          path: artifacts/EndlessSmileInspired-Windows-x64-VST3.zip
          if-no-files-found: error
